apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      initContainers:
        - name: filebrowser-init
          image: filebrowser/filebrowser:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              if [ ! -f /config/filebrowser.db ]; then
                echo "Initializing filebrowser db..."
                filebrowser config init -d /config/filebrowser.db
                filebrowser users add "${ADMIN_USER}" "${ADMIN_PASS}" --perm.admin -d /config/filebrowser.db
                echo "Admin user '${ADMIN_USER}' configured."
              else
                echo "filebrowser db exists; skipping init."
              fi
          env:
            - name: ADMIN_USER
              value: "admin"
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: filebrowser-admin
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          args: ["-d", "/config/filebrowser.db", "-r", "/srv", "-p", "80"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: smb
              mountPath: /srv
            - name: config
              mountPath: /config
      volumes:
        - name: smb
          persistentVolumeClaim: { claimName: filebrowser-smb-pvc }
        - name: config
          persistentVolumeClaim: { claimName: filebrowser-config-pvc }
