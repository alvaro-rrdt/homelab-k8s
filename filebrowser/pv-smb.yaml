apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-smb-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - vers=3.0
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: filebrowser-smb-pv
    volumeAttributes:
      source: "//u648454.your-storagebox.de/backup"
    nodeStageSecretRef:
      name: immich-smb-creds   # reuse the existing SOPS secret
      namespace: immich
