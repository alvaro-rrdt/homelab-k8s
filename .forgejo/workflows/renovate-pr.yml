name: AI PR Summary
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Fix DNS for Forgejo
        run: echo "10.43.120.174 forgejo.forgejo.svc.cluster.local" >> /etc/hosts

      - name: Get PR diff
        id: diff
        run: |
          curl -s -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
            "${{ github.event.pull_request.diff_url }}" > /tmp/pr.diff
          echo "diff_size=$(wc -c < /tmp/pr.diff)" >> $GITHUB_OUTPUT
          echo "PR_TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_ENV

      - name: Call DeepSeek
        id: ai
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          apt-get update -qq && apt-get install -y -qq jq > /dev/null 2>&1
          DIFF=$(cat /tmp/pr.diff | head -c 6000)
          RESP=$(curl -s https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -d "{\"model\":\"deepseek-v4-flash\",\"thinking\":{\"type\":\"disabled\"},\"messages\":[{\"role\":\"user\",\"content\":\"Summarize this dependency update PR in 3-4 sentences for a homelab owner: what changed, risk level, anything to watch. PR title: $PR_TITLE\n\nDiff:\n$DIFF\"}],\"max_tokens\":300}")
          echo "$RESP" | jq -r '.choices[0].message.content' > /tmp/summary.md
          cat /tmp/summary.md

      - name: Post comment
        run: |
          python3 -c "
          import json
          body = '🤖 **AI PR Summary**\n\n' + open('/tmp/summary.md').read()
          print(json.dumps({'body': body}))
          " > /tmp/comment.json
          curl --fail -s -X POST -H "Authorization: token ${{ secrets.GIT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/comment.json \
            "http://forgejo.forgejo.svc.cluster.local:3000/api/v1/repos/Alvaro.rm.rdt/homelab-k8s/issues/${{ github.event.pull_request.number }}/comments"
          echo "Comment posted (HTTP $?)"
