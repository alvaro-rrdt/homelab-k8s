name: Validate
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Fix DNS for Forgejo
        run: echo "10.43.120.174 forgejo.forgejo.svc.cluster.local" >> /etc/hosts

      - name: Install kubeconform (YAML validation)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          mv kubeconform /usr/local/bin/

      - name: Install Trivy (container CVE scanner)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Validate all manifests
        run: |
          cd /tmp
          git clone http://${{ secrets.GIT_TOKEN }}@forgejo.forgejo.svc.cluster.local:3000/Alvaro.rm.rdt/homelab-k8s.git repo
          cd repo
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git checkout FETCH_HEAD
          kubeconform -strict -summary --ignore-missing-schemas \
            vaultwarden/*.yaml actualbudget/*.yaml immich/*.yaml forgejo/*.yaml \
            uptime-kuma/*.yaml openwebui/*.yaml renovate/*.yaml act-runner/*.yaml

      - name: Scan container images for CVEs
        run: |
          cd /tmp/repo
          grep -rhoE 'image:\s*\S+' --include="*.yaml" . | awk '{print $2}' | sort -u > /tmp/images.txt
          cat /tmp/images.txt
          while read img; do
            [ -z "$img" ] && continue
            echo "=== Scanning: $img ==="
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img" 2>/dev/null | tail -15 || \
              echo "⚠️ Scan failed for $img (auth/registry) — continuing"
          done < /tmp/images.txt
