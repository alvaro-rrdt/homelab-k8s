apiVersion: v1
kind: ServiceAccount
metadata:
  name: actualbudget-refresh
  namespace: actualbudget
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actualbudget-refresh
  namespace: actualbudget
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actualbudget-refresh
  namespace: actualbudget
subjects:
  - kind: ServiceAccount
    name: actualbudget-refresh
    namespace: actualbudget
roleRef:
  kind: Role
  name: actualbudget-refresh
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: actualbudget-refresh
  namespace: actualbudget
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: actualbudget-refresh
          restartPolicy: Never
          containers:
            - name: refresh
              image: rancher/kubectl:v1.36.2
              command:
                - kubectl
                - delete
                - pod
                - -n
                - actualbudget
                - -l
                - app=actualbudget
                - --ignore-not-found
