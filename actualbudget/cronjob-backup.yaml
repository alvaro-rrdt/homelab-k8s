apiVersion: batch/v1
kind: CronJob
metadata:
  name: actualbudget-backup
  namespace: actualbudget
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: copy-backup
              image: alpine:3.24
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  mkdir -p /box
                  cp -a /data/. /box/
                  echo "Copied $(ls /box | wc -l) items"
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: box, mountPath: /box }
          containers:
            - name: done
              image: alpine:3.24
              command: ["/bin/true"]
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: actualbudget-data }
            - name: box
              persistentVolumeClaim: { claimName: actualbudget-smb-pvc }
