apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playwright
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo.forgejo.svc.cluster.local:3000/Alvaro.rm.rdt/homelab-k8s.git
    targetRevision: main
    path: playwright
  destination:
    server: https://kubernetes.default.svc
    namespace: playwright
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
